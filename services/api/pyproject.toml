[project]
name = "oratio-api"
version = "0.1.0"
description = "Oratio HTTP API: FastAPI on AWS Lambda behind the Lambda Web Adapter."
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "fastapi>=0.118",
    "pydantic-settings>=2.11",
    "speechgrade",
    "uvicorn>=0.37",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oratio_api"]

[tool.uv.sources]
speechgrade = { workspace = true }
