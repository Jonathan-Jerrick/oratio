[project]
name = "oratio-data"
version = "0.1.0"
description = "Builds the Oratio Contrastive Delivery Dataset: acquisition, flaw injection, labels, QC."
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "httpx>=0.28",
    "numpy>=2.1",
    "praat-parselmouth>=0.4.6",
    "pydantic>=2.11",
    "scipy>=1.16",
    "speechgrade",
]

[project.optional-dependencies]
colab = [
    "datasets>=3.0",
    "huggingface-hub>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oratio_data"]

[tool.uv.sources]
speechgrade = { workspace = true }
