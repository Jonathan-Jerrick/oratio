[project]
name = "speechgrade"
version = "0.1.0"
description = "Deterministic speech-delivery measurement: alignment, features, grounding, scoring."
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "httpx>=0.28",
    "lightgbm>=4.6",
    "numpy>=2.1",
    "onnxruntime>=1.23",
    "praat-parselmouth>=0.4.6",
    "pydantic>=2.11",
    "scipy>=1.16",
    "soundfile>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/speechgrade"]
